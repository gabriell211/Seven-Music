services:
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0-node
    restart: unless-stopped
    expose:
      - "4416"

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      YTDLP_POT_PROVIDER_URL: http://pot-provider:4416
    depends_on:
      - pot-provider
